[package]
name = "gpui-shadcn-gallery"
version = "0.1.0"
edition = "2024"
description = "Interactive desktop gallery for gpui-shadcn components"
license = "MIT"
repository = "https://github.com/weidix/gpui-shadcn"
readme = "../../README.md"
publish = false

[[bin]]
name = "gpui-shadcn"
path = "src/main.rs"

[dependencies]
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.10", features = ["font-kit", "x11", "wayland"] }
gpui-shadcn = { path = "../gpui-shadcn", features = ["geist"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "regex-fancy"] }
